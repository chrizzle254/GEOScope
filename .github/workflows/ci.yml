name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js (LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Cache Turborepo build output (optional but fast)
      - name: Cache Turbo build
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # 5️⃣ Lint and type-check
      - name: Lint
        run: npx turbo run lint
      - name: Type check
        run: npx turbo run type-check

      # 6️⃣ Build all apps
      - name: Build
        run: npx turbo run build

      # 7️⃣ (Optional) Run tests
      - name: Test
        run: npx turbo run test
